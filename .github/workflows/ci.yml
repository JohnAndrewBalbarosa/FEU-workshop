name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency: a new push to the same ref cancels in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio:
    name: Portfolio · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portfolio/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build

  dashboard:
    name: Dashboard · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      # CI-only dummy values so `next build` doesn't trip on env reads at module
      # init time. Real secrets live in Vercel; CI is build-verification only.
      DASHBOARD_USERNAME: ci-user
      DASHBOARD_PASSWORD_HASH: $2a$12$abcdefghijklmnopqrstuvCIonlyDoNotUseEverInProduction
      AUTH_SECRET: ci-only-32-bytes-of-padding-padding-padding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build

  secrets-scan:
    name: Secrets · gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
