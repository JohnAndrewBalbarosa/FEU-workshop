name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same ref cancels in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · portfolio + dashboard
    runs-on: ubuntu-latest
    env:
      # CI-only dummy values so `next build` doesn't trip on env reads at module
      # init time. Real secrets live in Vercel; CI is build-verification only.
      DASHBOARD_USERNAME: ci-user
      DASHBOARD_PASSWORD_HASH: $2a$12$abcdefghijklmnopqrstuvCIonlyDoNotUseEverInProduction
      AUTH_SECRET: ci-only-32-bytes-of-padding-padding-padding
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install per-workspace with `npm install` (not `npm ci`) so npm fixes the
      # optional-deps bug that prevents @rollup/rollup-linux-x64-gnu from
      # installing under a Windows-generated lockfile.
      - name: Install portfolio
        working-directory: portfolio
        run: npm install --no-audit --no-fund

      - name: Install dashboard
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Portfolio · typecheck + build
        working-directory: portfolio
        run: |
          npx tsc -b
          npm run build

      - name: Dashboard · typecheck + build
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npm run build

  secrets-scan:
    name: Secrets · gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
